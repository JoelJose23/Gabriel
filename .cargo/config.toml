# CUDA 13.3 is not recognized by cudarc 0.17.8 (from candle's ug-cuda dependency).
# Map it to CUDA 13.0 bindings which are backward compatible.
[env]
CUDARC_CUDA_VERSION = "13000"

# Legacy note: kokoro-tiny (the old native TTS backend) needed these system libs
# at link time, otherwise you got: undefined symbol: sonicDestroyStream, audio_object_*, etc.
# The TTS backend is now sherpa-onnx (tts-sherpa feature, enabled by default), so
# espeak-ng/sonic/pcaudio are no longer required. Keep this snippet in case that
# backend is ever revived:
#[build]
#rustflags = ["-L", "/usr/lib", "-l", "espeak-ng", "-l", "sonic", "-l", "pcaudio"]
